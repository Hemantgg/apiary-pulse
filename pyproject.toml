requires-python = ">=3.9"
dependencies = [
    "attrs>=23.2.0",
    "authlib>=1.3.2",
    "cachetools>=5.3.3",
    "certifi>=2024.0.0",
    "confluent-kafka>=2.5.0",
    "fastapi>=0.115.0",
    "fastavro>=1.9.5",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "uvicorn>=0.30.0",
]

[tool.uv]
package = false
